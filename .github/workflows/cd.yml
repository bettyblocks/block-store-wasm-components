on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip2
          cache-directories: "functions/*/*/target"
          cache-all-crates: "true"

      - uses: extractions/setup-just@v3

      - uses: ./.github/actions/install-wkg

      - name: Build all components
        run: just build

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-components
          path: functions/*/*/*.wasm

  push-ghcr:
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-wkg

      - name: Download wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-components
          path: functions

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all components to ghcr
        run: |
          for MANIFEST in functions/*/*/Cargo.toml; do
            COMPONENT_DIRECTORY=$(dirname "$MANIFEST")
            PACKAGE_REGISTRY_PATH="${{ env.REGISTRY }}/$(sed -nE '1s/package betty-blocks:([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+);/bettyblocks\/\1:\2/p' "$COMPONENT_DIRECTORY/wit/world.wit")"
            wkg oci push "$PACKAGE_REGISTRY_PATH" "$COMPONENT_DIRECTORY/"*.wasm
          done

  push-azure:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-wkg

      - name: Download wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-components
          path: functions

      - name: Log in to Azure registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}

      - name: Push all components to Azure registry
        run: |
          for MANIFEST in functions/*/*/Cargo.toml; do
            COMPONENT_DIRECTORY=$(dirname "$MANIFEST")
            PACKAGE_REGISTRY_PATH="${{ secrets.AZURE_REGISTRY }}/$(sed -nE '1s/package betty-blocks:([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+);/betty-blocks\/\1:\2/p' "$COMPONENT_DIRECTORY/wit/world.wit")"
            wkg oci push "$PACKAGE_REGISTRY_PATH" "$COMPONENT_DIRECTORY/"*.wasm
          done
