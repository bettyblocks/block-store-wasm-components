on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  cd:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip2
          cache-directories: "functions/*/*/target"
          cache-all-crates: "true"

      - uses: extractions/setup-just@v3

      - name: Install wkg
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v0.15.0/wkg-x86_64-unknown-linux-gnu -o wkg
          chmod +x wkg
          mv wkg /usr/local/bin/

      - name: Build all components
        run: just build

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all components to ghcr
        run: |
          for MANIFEST in functions/*/*/Cargo.toml; do
            COMPONENT_DIRECTORY=$(dirname "$MANIFEST")
            PACKAGE_REGISTRY_PATH="${{ env.REGISTRY }}/$(sed -nE '1s/package (betty-blocks:[a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+);/\1:\2/p' "$COMPONENT_DIRECTORY/wit/world.wit")"
            wkg oci push "$PACKAGE_REGISTRY_PATH" "$COMPONENT_DIRECTORY/"*.wasm
          done

      - name: Log in to Azure registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}

      - name: Push all components to Azure registry
        run: |
          for MANIFEST in functions/*/*/Cargo.toml; do
            COMPONENT_DIRECTORY=$(dirname "$MANIFEST")
            PACKAGE_REGISTRY_PATH="${{ secrets.AZURE_REGISTRY }}/$(sed -nE '1s/package (betty-blocks:[a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+);/\1:\2/p' "$COMPONENT_DIRECTORY/wit/world.wit")"
            wkg oci push "$PACKAGE_REGISTRY_PATH" "$COMPONENT_DIRECTORY/"*.wasm
          done
