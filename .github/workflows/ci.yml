name: CI

on:
  pull_request:
    branches: ["main"]
  # Pushes to main run this through release.yaml, which only publishes once it
  # passes.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          target: wasm32-wasip2
          cache-directories: target
          cache-all-crates: "true"

      - uses: extractions/setup-just@v3

      - uses: bettyblocks/wasm-base-components/.github/actions/install-wkg@main
        with:
          version: "0.15.1"

      - name: "formatting-check"
        run: RUSTFLAGS="--deny warnings" just format-check

      - name: "compile-check"
        run: RUSTFLAGS="--deny warnings" just build

      - name: "quality-check"
        run: RUSTFLAGS="--deny warnings" just quality-check

      - name: "test-check"
        run: RUSTFLAGS="--deny warnings" just test
